<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eaf7ef">
<title>碎碎花园 · Word Garden</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(170deg,#e9f7ee 0%,#f3fbf5 42%,#fdf8ec 100%);
  color:#2f3e46;overflow:hidden;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto;position:relative}

/* ---------- 顶栏 ---------- */
#hud{display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;flex:0 0 auto}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;
  background:rgba(255,255,255,.78);border:1px solid rgba(150,190,165,.4);
  border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(90,140,110,.08)}
.stat b{font-variant-numeric:tabular-nums}
.stat.sun{color:#b7791f}
.stat.cmb{color:#2f855a}
.stat.cmb.off{opacity:.35}
#hud .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(150,190,165,.45);
  background:rgba(255,255,255,.8);font-size:17px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn:active{transform:scale(.94)}

/* ---------- 屏幕 ---------- */
main{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  display:none;padding:4px 12px 12px}
.scr.on{display:block}

/* ---------- 棋盘 ---------- */
#boardTop{display:flex;align-items:center;justify-content:space-between;
  padding:2px 4px 8px;font-size:13px;color:#5b7168}
#boardTop .tip{font-weight:700}
#board{
  position:relative;width:100%;border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.6);
  box-shadow:0 10px 30px rgba(80,125,100,.14),inset 0 0 0 1px rgba(255,255,255,.9);
  aspect-ratio:var(--cols) / var(--rows);
}
.tile{position:absolute;left:0;top:0;padding:3px;will-change:transform;
  transition:transform .3s cubic-bezier(.3,1.25,.5,1)}
.tile .face{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;
  justify-content:center;text-align:center;padding:3px;line-height:1.08;font-weight:800;
  overflow-wrap:anywhere;word-break:break-word;
  transition:transform .16s ease,box-shadow .16s ease,opacity .2s ease}
.tile.en .face{background:linear-gradient(180deg,#eaf3ff,#d6e8ff);border:2px solid #b6d3f5;color:#1d4e7a}
.tile.zh .face{background:linear-gradient(180deg,#fff2f5,#ffe1e9);border:2px solid #f7c2cf;color:#8a2b46}
.tile.sel .face{transform:scale(1.07);box-shadow:0 0 0 3px #6ed39b,0 7px 16px rgba(60,120,90,.26)}
.tile.bad .face{animation:shake .42s ease}
.tile.hintpair .face{box-shadow:0 0 0 3px #ffce54;animation:breathe 1.1s ease-in-out infinite}
.tile.pop .face{transform:scale(1.3);opacity:0}
.tile.star .face{position:relative}
.tile.star .face::after{content:"✨";position:absolute;top:1px;right:3px;font-size:11px}
.tile.bomb .face{position:relative;box-shadow:0 0 0 2px #ffb09a}
.tile.bomb .face::after{content:"💥";position:absolute;top:1px;right:3px;font-size:11px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

#comboTag{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
  font-size:30px;font-weight:900;color:#e08a2e;opacity:0;pointer-events:none;
  text-shadow:0 3px 0 #fff,0 6px 18px rgba(200,140,60,.35);white-space:nowrap}
#comboTag.show{animation:cpop .75s ease-out}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}

/* ---------- 花园 ---------- */
.gcard{background:rgba(255,255,255,.72);border:1px solid rgba(160,200,175,.4);
  border-radius:18px;padding:12px;box-shadow:0 8px 22px rgba(85,130,105,.1);margin-bottom:12px}
.gcard h3{margin:0 0 8px;font-size:14px;color:#43695a;display:flex;align-items:center;gap:6px}
.gcard h3 .n{font-weight:600;color:#7c9488;font-size:12px;margin-left:auto}
#lawn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  background:linear-gradient(180deg,#dff2e2,#cfeacf);border-radius:14px;padding:8px;
  box-shadow:inset 0 2px 10px rgba(90,150,110,.16)}
.plot{aspect-ratio:1;border-radius:12px;border:2px dashed rgba(120,175,140,.45);
  background:rgba(255,255,255,.34);display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;cursor:pointer;padding:0;position:relative;
  transition:transform .16s,background .16s}
.plot:active{transform:scale(.93)}
.plot.filled{border-style:solid;border-color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.5)}
.plot .sw{display:block;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 85%}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.plot .plus{font-size:16px;color:#8fbfa2;font-weight:800}

.shoprow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px}
.shoprow+.shoprow{border-top:1px dashed rgba(150,190,165,.32)}
.shoprow .em{font-size:25px;width:34px;text-align:center;flex:0 0 auto}
.shoprow .nm{font-weight:700;font-size:14px;flex:1;min-width:0}
.shoprow .nm small{display:block;font-weight:500;color:#8aa79a;font-size:11px}
.shoprow .go{border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;
  background:linear-gradient(180deg,#68d391,#48bb78);color:#fff;cursor:pointer;
  box-shadow:0 3px 10px rgba(72,187,120,.35);flex:0 0 auto}
.shoprow .go:active{transform:scale(.95)}
.shoprow .go.no{background:#e6ece8;color:#9db3a8;box-shadow:none}
.shoprow .go.have{background:rgba(255,255,255,.9);color:#48a06e;border:1px solid #a8dcc0}

/* ---------- 图鉴 ---------- */
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.wcard{background:rgba(255,255,255,.72);border:1px solid rgba(165,200,180,.4);
  border-radius:12px;padding:8px 10px;cursor:pointer;overflow:hidden}
.wcard:active{transform:scale(.97)}
.wcard .e{font-weight:800;font-size:13px;color:#1d4e7a;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wcard .z{font-size:12px;color:#8a2b46;margin-top:2px}
.wcard.locked{opacity:.34}
.wcard.locked .e,.wcard.locked .z{color:#7d8f87}

/* ---------- 底部标签 ---------- */
#tabs{flex:0 0 auto;display:flex;gap:6px;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
#tabs button{flex:1;border:0;border-radius:14px;padding:9px 4px 7px;background:transparent;
  color:#84a094;font-size:11px;font-weight:700;cursor:pointer;line-height:1.5}
#tabs button .i{display:block;font-size:19px;line-height:1.15;filter:grayscale(.6);opacity:.7}
#tabs button.on{background:rgba(255,255,255,.85);color:#3d7a5e;
  box-shadow:0 4px 14px rgba(85,130,105,.14)}
#tabs button.on .i{filter:none;opacity:1}
#tabs button:active{transform:scale(.96)}

/* ---------- 浮层 ---------- */
.ovl{position:fixed;inset:0;background:rgba(38,58,48,.42);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.ovl.on{display:flex}
.sheet{width:100%;max-width:540px;max-height:82vh;overflow-y:auto;
  background:#fbfdfb;border-radius:22px 22px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  box-shadow:0 -12px 40px rgba(40,70,55,.24);animation:up .26s cubic-bezier(.3,1.2,.5,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .sub{color:#82a094;font-size:12.5px;margin-bottom:12px}
.sheet .row{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.sheet .row+.row{border-top:1px solid rgba(160,200,180,.28)}
.sheet .row .lbl{flex:1;font-weight:700}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{aspect-ratio:1;border-radius:14px;border:2px solid rgba(160,200,180,.5);
  background:#fff;font-size:27px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.pick.on{border-color:#48bb78;box-shadow:0 0 0 3px rgba(72,187,120,.25)}
.pick:active{transform:scale(.94)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid rgba(160,200,180,.55);background:#fff;border-radius:11px;
  padding:8px 0;font-weight:700;font-size:13px;color:#5b7168;cursor:pointer}
.seg button.on{background:#48bb78;border-color:#48bb78;color:#fff}
.danger{width:100%;margin-top:14px;border:1px solid #f0b8b8;background:#fff5f5;color:#c05656;
  border-radius:12px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);
  transform:translate(-50%,-14px);background:rgba(44,66,55,.94);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:.26s;z-index:80;max-width:88vw;text-align:center;
  box-shadow:0 8px 24px rgba(30,60,45,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}

.fx{position:fixed;pointer-events:none;z-index:70;font-size:15px;font-weight:800;
  color:#d69a2a;text-shadow:0 2px 0 #fff,0 4px 12px rgba(200,150,60,.35)}
.pt{position:fixed;pointer-events:none;z-index:70;font-size:15px;line-height:1}
</style>
</head>

<div id="app">

  <div id="hud">
    <div class="stat sun">☀️ <b id="hudSun">0</b></div>
    <div class="stat cmb off" id="hudCmbWrap">🔥 <b id="hudCmb">0</b></div>
    <div class="sp"></div>
    <button class="iconbtn" id="btnSet" aria-label="设置">⚙️</button>
  </div>

  <main>
    <!-- ===== 消除 ===== -->
    <section class="scr on" id="scrPlay">
      <div id="boardTop">
        <span class="tip" id="playTip">点一个蓝块，再点它对应的粉块</span>
        <span id="playCount">已消 0 对</span>
      </div>
      <div id="board"><div id="comboTag"></div></div>
    </section>

    <!-- ===== 花园 ===== -->
    <section class="scr" id="scrGarden">
      <div class="gcard">
        <h3>🌿 我的花园 <span class="n" id="gardenCount"></span></h3>
        <div id="lawn"></div>
      </div>
      <div class="gcard">
        <h3>🌱 种子铺 <span class="n" id="shopHint"></span></h3>
        <div id="shop"></div>
      </div>
    </section>

    <!-- ===== 图鉴 ===== -->
    <section class="scr" id="scrDex">
      <div class="gcard">
        <h3>📖 单词图鉴 <span class="n" id="dexCount"></span></h3>
        <div class="wgrid" id="dexGrid"></div>
      </div>
    </section>
  </main>

  <nav id="tabs">
    <button class="on" data-scr="play"><span class="i">🎮</span>消除</button>
    <button data-scr="garden"><span class="i">🌷</span>花园</button>
    <button data-scr="dex"><span class="i">📖</span>图鉴</button>
  </nav>
</div>

<!-- 种什么 -->
<div class="ovl" id="ovlPick"><div class="sheet">
  <h2>种点什么</h2>
  <div class="sub">解锁过的都能随便种，不花阳光</div>
  <div class="picks" id="pickGrid"></div>
  <button class="danger" id="pickClear">🗑 拔掉这一格</button>
</div></div>

<!-- 设置 -->
<div class="ovl" id="ovlSet"><div class="sheet">
  <h2>设置</h2>
  <div class="sub">随便改，自动保存</div>

  <div class="row"><span class="lbl">棋盘大小</span>
    <div class="seg" id="segSize">
      <button data-c="4" data-r="5">小</button>
      <button data-c="4" data-r="6">中</button>
      <button data-c="5" data-r="6">大</button>
    </div>
  </div>
  <div class="row"><span class="lbl">背景音乐</span>
    <div class="seg" id="segMusic">
      <button data-v="1">开</button><button data-v="0">关</button>
    </div>
  </div>
  <div class="row"><span class="lbl">音效</span>
    <div class="seg" id="segSfx">
      <button data-v="1">开</button><button data-v="0">关</button>
    </div>
  </div>
  <div class="row"><span class="lbl">点英文块自动朗读</span>
    <div class="seg" id="segTts">
      <button data-v="1">开</button><button data-v="0">关</button>
    </div>
  </div>

  <button class="danger" id="btnReset">清空所有进度（重来）</button>
</div></div>

<div id="toast"></div>

const SAVE_KEY = "sshy_v1";
const PLOT_COLS = 5, PLOT_ROWS = 6, PLOTS = PLOT_COLS * PLOT_ROWS;

const DEFAULTS = {
  sun: 0, matches: 0, best: 0,
  owned: { grass: true },
  plots: new Array(PLOTS).fill(null),
  seen: [],
  cols: 4, rows: 6,
  music: true, sfx: true, tts: true
};

let S = load();

function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const o = JSON.parse(raw);
    const s = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), o);
    if (!Array.isArray(s.plots) || s.plots.length !== PLOTS) {
      const p = new Array(PLOTS).fill(null);
      if (Array.isArray(s.plots)) for (let i = 0; i < Math.min(PLOTS, s.plots.length); i++) p[i] = s.plots[i];
      s.plots = p;
    }
    if (!Array.isArray(s.seen)) s.seen = [];
    return s;
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
}
let saveTimer = null;
function save(){
  if (saveTimer) return;
  saveTimer = setTimeout(() => {
    saveTimer = null;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }, 260);
}
function saveNow(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ==========================================================================
   小工具
   ========================================================================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffled(a){
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function buzz(p){
  if (!navigator.vibrate) return;
  try { navigator.vibrate(p); } catch (e) {}
}

let toastT = null;
function toast(msg, ms){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("on"), ms || 1700);
}

/* ==========================================================================
   声音 —— 全部实时合成，不加载任何文件
   ========================================================================== */
const Audio2 = {
  ctx: null, master: null, wet: null, sfxGain: null, musicGain: null,
  ready: false, started: false,

  boot(){
    if (this.ready) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      const ctx = new AC();
      this.ctx = ctx;
      this.master = ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(ctx.destination);

      // 混响：自己生成一段衰减噪声当 impulse response
      const conv = ctx.createConvolver();
      conv.buffer = this.makeIR(2.6, 2.6);
      const wetG = ctx.createGain();
      wetG.gain.value = 0.42;
      this.wet = ctx.createGain();
      this.wet.connect(conv);
      conv.connect(wetG);
      wetG.connect(this.master);

      this.sfxGain = ctx.createGain();
      this.sfxGain.gain.value = 0.5;
      this.sfxGain.connect(this.master);
      this.sfxGain.connect(this.wet);

      this.musicGain = ctx.createGain();
      this.musicGain.gain.value = 0.0001;
      this.musicGain.connect(this.master);
      this.musicGain.connect(this.wet);

      this.ready = true;
      return true;
    } catch (e) { return false; }
  },

  makeIR(sec, decay){
    const ctx = this.ctx, rate = ctx.sampleRate, len = Math.floor(rate * sec);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  },

  // 必须在用户手势里调用
  wake(){
    if (!this.boot()) return;
    try { if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) {}
    if (!this.started) { this.started = true; Music.start(); }
  },

  tone(freq, o){
    if (!this.ready || !S.sfx) return;
    o = o || {};
    const ctx = this.ctx, t = ctx.currentTime;
    const dur = o.dur || 0.6, gain = o.gain || 0.16, type = o.type || "sine";
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + (o.atk || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(o.bus || this.sfxGain);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  noise(dur, gain, freq){
    if (!this.ready || !S.sfx) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = freq || 900;
    const g = ctx.createGain();
    g.gain.value = gain || 0.2;
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start(t);
  }
};

/* 五声音阶：无论怎么随机都不会难听 */
const PENTA = [0, 2, 4, 7, 9];
function noteFreq(semi, oct){
  return 261.63 * Math.pow(2, semi / 12) * Math.pow(2, oct || 0);
}

const Sfx = {
  tapEn(){ Audio2.tone(660, { dur: .16, gain: .09, type: "sine" }); },
  tapZh(){ Audio2.tone(520, { dur: .16, gain: .09, type: "sine" }); },
  match(combo){
    const step = Math.min(combo, 12);
    const semi = PENTA[step % 5] + 12 * Math.floor(step / 5);
    Audio2.tone(noteFreq(semi, 1), { dur: .7, gain: .14, type: "sine" });
    Audio2.tone(noteFreq(semi, 2), { dur: .45, gain: .055, type: "sine" });
  },
  soft(){ Audio2.tone(196, { dur: .3, gain: .07, type: "triangle" }); },
  plant(){ Audio2.tone(noteFreq(PENTA[rnd(5)], 1), { dur: .5, gain: .11 }); },
  coin(){ [0, 4, 7].forEach((s, i) => setTimeout(() => Audio2.tone(noteFreq(s, 1), { dur: .35, gain: .1 }), i * 70)); },
  unlock(){ [0, 4, 7, 12, 16].forEach((s, i) => setTimeout(() => Audio2.tone(noteFreq(s, 1), { dur: .7, gain: .11 }), i * 95)); },
  boom(){ Audio2.noise(.5, .26, 620); Audio2.tone(120, { dur: .5, gain: .16, glide: 48, type: "triangle" }); }
};

/* ==========================================================================
   背景音乐 —— 生成式：慢和弦铺底 + 随机铃音
   ========================================================================== */
const Music = {
  on: false, timer: null, melTimer: null, idx: 0,
  chords: [
    [174.61, [0, 4, 7, 11]],   // Fmaj7
    [130.81, [0, 4, 7, 11]],   // Cmaj7
    [146.83, [0, 3, 7, 10]],   // Dm7
    [196.00, [0, 4, 7, 11]]    // G7
  ],
  start(){
    if (!Audio2.ready || this.on) return;
    this.on = true;
    if (!S.music) { Audio2.musicGain.gain.value = 0.0001; }
    else { Audio2.musicGain.gain.setTargetAtTime(0.34, Audio2.ctx.currentTime, 2.2); }
    this.playChord();
    this.timer = setInterval(() => this.playChord(), 8200);
    this.melTimer = setInterval(() => this.melody(), 1500);
  },
  stop(){
    this.on = false;
    if (this.timer) clearInterval(this.timer);
    if (this.melTimer) clearInterval(this.melTimer);
    this.timer = this.melTimer = null;
    if (Audio2.ready) Audio2.musicGain.gain.setTargetAtTime(0.0001, Audio2.ctx.currentTime, .5);
  },
  apply(){
    if (!Audio2.ready || !this.on) return;
    Audio2.musicGain.gain.setTargetAtTime(S.music ? 0.34 : 0.0001, Audio2.ctx.currentTime, .6);
  },
  playChord(){
    if (!Audio2.ready || !S.music) { this.idx = (this.idx + 1) % this.chords.length; return; }
    const ctx = Audio2.ctx, t = ctx.currentTime;
    const [root, ivs] = this.chords[this.idx];
    this.idx = (this.idx + 1) % this.chords.length;

    // 低音
    const b = ctx.createOscillator();
    b.type = "sine";
    b.frequency.value = root / 2;
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.linearRampToValueAtTime(0.5, t + 3.5);
    bg.gain.linearRampToValueAtTime(0.0001, t + 11);
    b.connect(bg); bg.connect(Audio2.musicGain);
    b.start(t); b.stop(t + 11.4);

    // 和弦垫：每个音两根略微失谐的振荡器
    for (const iv of ivs) {
      for (const det of [-4, 4]) {
        const o = ctx.createOscillator();
        o.type = "sine";
        o.frequency.value = root * Math.pow(2, iv / 12);
        o.detune.value = det;
        const g = ctx.createGain();
        const peak = 0.16 / ivs.length;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + 3.2);
        g.gain.linearRampToValueAtTime(0.0001, t + 10.6);
        o.connect(g); g.connect(Audio2.musicGain);
        o.start(t); o.stop(t + 11);
      }
    }
  },
  melody(){
    if (!Audio2.ready || !S.music) return;
    if (Math.random() < 0.42) return;          // 留白才有呼吸感
    const ctx = Audio2.ctx, t = ctx.currentTime;
    const semi = PENTA[rnd(5)] + 12 * (Math.random() < .5 ? 1 : 2);
    const f = noteFreq(semi, 0);
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
    o.connect(g); g.connect(Audio2.musicGain);
    o.start(t); o.stop(t + 3.6);
  }
};

   朗读
   ========================================================================== */
const TTS = {
  voice: null,
  pick(){
    try {
      if (!("speechSynthesis" in window)) return;
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      for (const name of ["Google US English", "Microsoft Aria", "Microsoft Zira", "Samantha"]) {
        const v = vs.find(x => x.name && x.name.indexOf(name) >= 0);
        if (v) { this.voice = v; return; }
      }
      this.voice = vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang)) || null;
    } catch (e) {}
  },
  say(text, rate){
    if (!S.tts) return;
    try {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = rate || 0.86;
      if (this.voice) u.voice = this.voice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
};
try {
  if ("speechSynthesis" in window) {
    TTS.pick();
    speechSynthesis.onvoiceschanged = () => TTS.pick();
  }
} catch (e) {}

/* ==========================================================================
   棋盘
   --------------------------------------------------------------------------
   关键不变量：棋盘上每个 wid 恰好两个方块，一个 en 一个 zh。
   破了这条就会出现永远配不掉的孤块。

   手感上的关键决定：模型（B.grid / B.all）**同步**更新，只有视觉是异步的。
   所以永远不需要用 busy 锁住输入 —— 这正是旧版「点了没反应」的根源。
   ========================================================================== */
const B = { cols: 4, rows: 6, grid: [], all: [], sel: null, nextId: 1 };

const boardEl = $("board");

function makeTile(wid, type, star){
  const w = WORDS[wid];
  const t = {
    id: B.nextId++, wid: wid, type: type,
    text: type === "en" ? w.en : w.zh,
    star: !!star, bomb: false, col: 0, row: 0, el: null, dead: false
  };
  B.all.push(t);          // 必须在建方块时就登记，renderBoard 靠 B.all 遍历
  return t;
}

function onBoardWid(wid){
  for (const t of B.all) if (t.wid === wid && !t.dead) return true;
  return false;
}

function buildBoard(){
  for (const t of B.all) if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
  B.all = []; B.sel = null; B.nextId = 1;
  B.cols = S.cols; B.rows = S.rows;
  boardEl.style.setProperty("--cols", B.cols);
  boardEl.style.setProperty("--rows", B.rows);
  B.grid = [];
  for (let c = 0; c < B.cols; c++) B.grid.push([]);

  const pairs = Math.floor(B.cols * B.rows / 2);
  const pool = shuffled(WORDS).slice(0, pairs);
  const tiles = [];
  for (const w of pool) {
    tiles.push(makeTile(w.id, "en", false));
    tiles.push(makeTile(w.id, "zh", false));
  }
  const bag = shuffled(tiles);
  let k = 0;
  for (let c = 0; c < B.cols; c++) {
    for (let r = 0; r < B.rows; r++) {
      const t = bag[k++];
      if (t) { t.col = c; t.row = r; B.grid[c].push(t); }
    }
  }
  // 撒几个幸运方块
  const stars = Math.random() < .5 ? 1 : 2;
  for (let i = 0; i < stars; i++) {
    const t = pick(B.all.filter(x => !x.star)) || B.all[0];
    if (t) t.star = true;
  }
  ensureSpecials();
  renderBoard(true);
}

/* 特殊方块：场上常驻 0~2 个 💥，配对时炸掉周围一圈 */
function ensureSpecials(){
  const have = B.all.filter(t => t.bomb && !t.dead).length;
  if (have >= 2) return;
  if (Math.random() > .5) return;
  const cand = B.all.filter(t => !t.dead && !t.bomb && !t.star);
  if (!cand.length) return;
  const t = pick(cand);
  t.bomb = true;
  if (t.el) t.el.classList.add("bomb");
}

function renderBoard(instant){
  for (const t of B.all) spawnTile(t, instant, instant ? 0 : B.rows);
  layoutAll(instant);
}

function spawnTile(t, instant, fromRows){
  if (t.el) return;
  const el = document.createElement("div");
  el.className = "tile " + t.type + (t.star ? " star" : "") + (t.bomb ? " bomb" : "");
  el.dataset.id = t.id;
  const face = document.createElement("div");
  face.className = "face";
  face.textContent = t.text;
  el.appendChild(face);
  el.style.transform = "translate(" + (t.col * 100) + "%," + ((t.row - (fromRows || 0)) * 100) + "%)";
  boardEl.appendChild(el);
  t.el = el;
}

function fontFor(text, isEn, w, h){
  const n = Math.max(1, text.length);
  const byH = h * 0.34;
  const byW = isEn ? w / (n * 0.56) : (n <= 3 ? w / n : (w * 2) / n);
  return Math.max(9, Math.min(byH, byW, 21));
}

function layoutAll(instant){
  const W = 100 / B.cols, H = 100 / B.rows;
  const bw = boardEl.clientWidth / B.cols;
  const bh = boardEl.clientHeight / B.rows;
  for (const t of B.all) {
    if (!t.el) continue;
    t.el.style.transition = instant ? "none" : "";
    t.el.style.width = W + "%";
    t.el.style.height = H + "%";
    const f = t.el.firstChild;
    if (f) f.style.fontSize = fontFor(t.text, t.type === "en", bw - 8, bh - 8) + "px";
    t.el.style.transform = "translate(" + (t.col * 100) + "%," + (t.row * 100) + "%)";
  }
  if (instant) {
    void boardEl.offsetWidth;
    for (const t of B.all) if (t.el) t.el.style.transition = "";
  }
}

function placeAll(){
  for (let c = 0; c < B.cols; c++) {
    const col = B.grid[c];
    for (let r = 0; r < col.length; r++) { col[r].col = c; col[r].row = r; }
  }
}

function clearEl(t){
  if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
  t.el = null;
  const i = B.all.indexOf(t);
  if (i >= 0) B.all.splice(i, 1);
}

/* 补块：新方块必须成对出现 */
function refill(){
  const holes = [];
  for (let c = 0; c < B.cols; c++) {
    const miss = B.rows - B.grid[c].length;
    for (let k = 0; k < miss; k++) holes.push(c);
  }
  if (!holes.length) return;
  if (holes.length % 2) holes.pop();          // 防御：不变量要求偶数

  const need = holes.length / 2;
  const avail = shuffled(WORDS.filter(w => !onBoardWid(w.id)));
  const pool = avail.length >= need ? avail : shuffled(WORDS);

  const fresh = [];
  for (let i = 0; i < need; i++) {
    const w = pool[i % pool.length];
    const enFirst = Math.random() < .5;
    fresh.push(makeTile(w.id, enFirst ? "en" : "zh", false));
    fresh.push(makeTile(w.id, enFirst ? "zh" : "en", false));
  }
  const bag = shuffled(fresh).slice(0, holes.length);

  const byCol = new Map();
  holes.forEach((c, i) => {
    if (!byCol.has(c)) byCol.set(c, []);
    if (bag[i]) byCol.get(c).push(bag[i]);
  });
  for (const [c, list] of byCol) B.grid[c] = list.concat(B.grid[c]);

  for (const t of bag) spawnTile(t, false, B.rows);
  placeAll();
  // 先让浏览器认下「在棋盘上方」这个起始位置，落下动画才会真的播
  void boardEl.offsetWidth;
  layoutAll(false);
}

function mateOf(t){
  for (const x of B.all) {
    if (x !== t && !x.dead && x.wid === t.wid && x.type !== t.type) return x;
  }
  return null;
}

function neighborsOf(t){
  const out = [];
  for (const d of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
    const c = t.col + d[0], r = t.row + d[1];
    if (c < 0 || c >= B.cols) continue;
    const col = B.grid[c];
    if (r < 0 || r >= col.length) continue;
    if (col[r]) out.push(col[r]);
  }
  return out;
}

/* ==========================================================================
   点击
   ========================================================================== */
function onTap(t){
  if (!t || t.dead || t.el === null) return;
  Audio2.wake();
  clearHint();

  if (B.sel === t) {
    t.el.classList.remove("sel");
    B.sel = null;
    Sfx.soft();
    return;
  }

  if (!B.sel) {
    B.sel = t;
    t.el.classList.add("sel");
    if (t.type === "en") { Sfx.tapEn(); TTS.say(WORDS[t.wid].en); }
    else Sfx.tapZh();
    return;
  }

  const a = B.sel;
  if (a.wid === t.wid && a.type !== t.type) {
    a.el.classList.remove("sel");
    B.sel = null;
    doMatch(a, t);
  } else {
    a.el.classList.remove("sel");
    B.sel = null;
    doMiss(a, t);
  }
}

let combo = 0;

function doMatch(a, b){
  combo++;
  if (combo > S.best) { S.best = combo; }

  const w = WORDS[a.wid];
  const gain = Math.round((3 + Math.min(combo, 10)) * ((a.star || b.star) ? 3 : 1));

  const victims = [a, b];
  if (a.bomb || b.bomb) {
    Sfx.boom(); buzz([14, 28, 20]);
    for (const t of [a, b]) {
      for (const nb of neighborsOf(t)) if (nb !== a && nb !== b) victims.push(nb);
    }
    for (const v of victims.slice()) {
      const m = mateOf(v);
      if (m && victims.indexOf(m) < 0) victims.push(m);
    }
  } else {
    Sfx.match(combo);
    buzz(12);
  }

  // ---- 模型同步更新（这一步之后，输入立刻可以继续） ----
  for (const t of victims) { t.dead = true; if (t.el) t.el.classList.add("pop"); }
  for (let c = 0; c < B.cols; c++) B.grid[c] = B.grid[c].filter(t => !t.dead);
  setTimeout(() => { for (const t of victims) clearEl(t); }, 300);

  S.sun += gain;
  S.matches++;
  if (S.seen.indexOf(w.en) < 0) S.seen.push(w.en);
  save();

  // 头一回玩，引导去花园，否则容易只消不懂养成
  if (S.matches === 5 && Object.keys(S.owned).length <= 1) {
    setTimeout(() => toast("攒够 ☀️ 了！去【花园】解锁第一朵花 🌼", 3000), 900);
  }

  // ---- 视觉 / 听觉 ----
  const r = a.el ? a.el.getBoundingClientRect() : null;
  if (r) flyText(r.left + r.width / 2, r.top + r.height / 2, "+" + gain + " ☀️");
  if (r) burst(victims.length > 2 ? 14 : 5, r.left + r.width / 2, r.top + r.height / 2);
  if (combo >= 3) showCombo(combo);
  if (combo > 0 && combo % 5 === 0) { confetti(18); Sfx.coin(); }
  buzz(10);

  refill();
  ensureSpecials();
  updateHud();

  if (combo === 1) TTS.say(w.en, 0.9);
  else if (Math.random() < .5) TTS.say(w.en, 0.92);
}

function doMiss(a, b){
  combo = 0;
  Sfx.soft();
  buzz([10, 30, 10]);

  const w = WORDS[a.wid];
  if (S.seen.indexOf(w.en) < 0) { S.seen.push(w.en); save(); }

  // 轻轻晃一下，不扣任何东西
  for (const t of [a, b]) {
    if (!t.el) continue;
    t.el.classList.add("bad");
    setTimeout(() => { if (t.el) t.el.classList.remove("bad"); }, 460);
  }
  hintPair(a, mateOf(a));
  // 告诉答案，但语气是「顺便告诉你」
  toast(w.en + " = " + w.zh, 1500);
  TTS.say(w.en, 0.82);
  updateHud();
}

/* ==========================================================================
   提示
   ========================================================================== */
let hintT = null, hintTimer = null;
function hintPair(x, y){
  clearHint();
  const arr = [x, y].filter(Boolean);
  if (!arr.length) return;
  hintT = arr;
  for (const t of arr) if (t.el) t.el.classList.add("hintpair");
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(clearHint, 2000);
}
function clearHint(){
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  if (!hintT) return;
  for (const t of hintT) if (t.el) t.el.classList.remove("hintpair");
  hintT = null;
}
function autoHint(){
  if (B.sel || hintT) return;
  const live = B.all.filter(t => !t.dead && t.type === "en");
  if (!live.length) return;
  const t = pick(live);
  const m = mateOf(t);
  if (m) hintPair(t, m);
}

/* ==========================================================================
   视觉特效
   ========================================================================== */
const PETALS = ["🌸", "🌼", "✨", "🌿", "💚"];

function flyText(x, y, txt){
  const d = document.createElement("div");
  d.className = "fx";
  d.textContent = txt;
  d.style.left = x + "px";
  d.style.top = y + "px";
  document.body.appendChild(d);
  try {
    d.animate(
      [{ transform: "translate(-50%,-50%) scale(.7)", opacity: 0 },
       { transform: "translate(-50%,-120%) scale(1.15)", opacity: 1, offset: .3 },
       { transform: "translate(-50%,-260%) scale(1)", opacity: 0 }],
      { duration: 1000, easing: "cubic-bezier(.2,.8,.3,1)" }
    ).onfinish = () => d.remove();
  } catch (e) { setTimeout(() => d.remove(), 900); }
}

function burst(n, x, y){
  for (let i = 0; i < n; i++) petal(x, y, 90);
}
function confetti(n){
  for (let i = 0; i < n; i++) petal(window.innerWidth / 2, 0, 260);
}
function petal(x, y, spread){
  const d = document.createElement("div");
  d.className = "pt";
  d.textContent = pick(PETALS);
  d.style.left = x + "px";
  d.style.top = y + "px";
  document.body.appendChild(d);
  const dx = (Math.random() - .5) * spread * 2;
  const dy = (Math.random() * spread) + 40;
  const rot = (Math.random() - .5) * 540;
  try {
    d.animate(
      [{ transform: "translate(-50%,-50%) rotate(0deg) scale(.6)", opacity: 1 },
       { transform: "translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) rotate(" + rot + "deg) scale(1)", opacity: 0 }],
      { duration: 900 + Math.random() * 700, easing: "cubic-bezier(.25,.7,.4,1)" }
    ).onfinish = () => d.remove();
  } catch (e) { setTimeout(() => d.remove(), 1200); }
}

function showCombo(n){
  const el = $("comboTag");
  const words = { 3: "不错", 5: "连击 5", 8: "连击 8", 12: "连击 12", 16: "顺得离谱", 20: "无敌了" };
  el.textContent = words[n] || ("连击 " + n + " 🔥");
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

/* ==========================================================================
   界面
   ========================================================================== */
function updateHud(){
  $("hudSun").textContent = S.sun;
  const w = $("hudCmbWrap");
  $("hudCmb").textContent = combo;
  w.classList.toggle("off", combo < 2);
  $("playCount").textContent = "已消 " + S.matches + " 对";
}

function showScreen(name){
  for (const s of document.querySelectorAll(".scr")) s.classList.toggle("on", s.id === "scr" + name.charAt(0).toUpperCase() + name.slice(1));
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.scr === name);
  if (name === "garden") renderGarden();
  if (name === "dex") renderDex();
  if (name === "play") setTimeout(() => layoutAll(true), 30);
}

/* ---------- 花园 ---------- */
function renderGarden(){
  const lawn = $("lawn");
  lawn.innerHTML = "";
  let filled = 0;
  for (let i = 0; i < PLOTS; i++) {
    const id = S.plots[i];
    const b = document.createElement("button");
    b.className = "plot" + (id ? " filled" : "");
    b.dataset.i = i;
    if (id) {
      const d = DECOS.find(x => x.id === id);
      const sp = document.createElement("span");
      sp.className = "sw";
      sp.textContent = d ? d.e : "🌱";
      sp.style.animationDelay = (Math.random() * 3.4).toFixed(2) + "s";
      b.appendChild(sp);
      filled++;
    } else {
      const sp = document.createElement("span");
      sp.className = "plus";
      sp.textContent = "+";
      b.appendChild(sp);
    }
    lawn.appendChild(b);
  }
  $("gardenCount").textContent = filled + " / " + PLOTS;
  renderShop();
}

function renderShop(){
  const shop = $("shop");
  shop.innerHTML = "";
  let nextCost = null;
  for (const d of DECOS) {
    const owned = !!S.owned[d.id];
    if (!owned && nextCost === null) nextCost = d.c - S.sun;
    const row = document.createElement("div");
    row.className = "shoprow";

    const em = document.createElement("div");
    em.className = "em";
    em.textContent = owned ? d.e : "❔";
    row.appendChild(em);

    const nm = document.createElement("div");
    nm.className = "nm";
    nm.innerHTML = esc(owned ? d.n : "???") + "<small>" + esc(owned ? d.d : "还没解锁，慢慢来") + "</small>";
    row.appendChild(nm);

    const btn = document.createElement("button");
    btn.className = "go";
    if (owned) {
      btn.classList.add("have");
      btn.textContent = "已解锁";
      btn.disabled = true;
    } else if (S.sun >= d.c) {
      btn.textContent = "☀️ " + d.c;
      btn.onclick = () => unlock(d);
    } else {
      btn.classList.add("no");
      btn.textContent = "☀️ " + d.c;
      btn.disabled = true;
    }
    row.appendChild(btn);
    shop.appendChild(row);
  }
  $("shopHint").textContent = nextCost !== null ? ("再消 " + Math.max(0, nextCost) + " ☀️ 解锁下一个") : "全解锁了 🌈";
}

function unlock(d){
  if (S.owned[d.id] || S.sun < d.c) return;
  S.sun -= d.c;
  S.owned[d.id] = true;
  saveNow();
  Sfx.unlock();
  confetti(22);
  toast("解锁了 " + d.e + " " + d.n + "！去花园种下吧", 2200);
  updateHud();
  renderGarden();
}

/* ---------- 种东西 ---------- */
let pickingPlot = -1;
function openPick(i){
  pickingPlot = i;
  const grid = $("pickGrid");
  grid.innerHTML = "";
  for (const d of DECOS) {
    if (!S.owned[d.id]) continue;
    const b = document.createElement("button");
    b.className = "pick" + (S.plots[i] === d.id ? " on" : "");
    b.textContent = d.e;
    b.title = d.n;
    b.onclick = () => {
      S.plots[i] = d.id;
      Sfx.plant();
      saveNow();
      closeAll();
      renderGarden();
    };
    grid.appendChild(b);
  }
  openOvl("ovlPick");
}

/* ---------- 图鉴 ---------- */
function renderDex(){
  const g = $("dexGrid");
  g.innerHTML = "";
  const seen = new Set(S.seen);
  for (const w of WORDS) {
    const has = seen.has(w.en);
    const c = document.createElement("div");
    c.className = "wcard" + (has ? "" : " locked");
    c.innerHTML = '<div class="e">' + esc(has ? w.en : "• • •") + '</div>' +
                  '<div class="z">' + esc(has ? w.zh : "还没遇到") + "</div>";
    if (has) c.onclick = () => { Audio2.wake(); TTS.say(w.en); Sfx.soft(); };
    g.appendChild(c);
  }
  $("dexCount").textContent = S.seen.length + " / " + WORDS.length;
}

/* ---------- 浮层 ---------- */
function openOvl(id){ $(id).classList.add("on"); }
function closeAll(){ for (const o of document.querySelectorAll(".ovl")) o.classList.remove("on"); }

function renderSettings(){
  for (const b of document.querySelectorAll("#segSize button")) {
    b.classList.toggle("on", +b.dataset.c === S.cols && +b.dataset.r === S.rows);
  }
  setSeg("segMusic", S.music ? "1" : "0");
  setSeg("segSfx", S.sfx ? "1" : "0");
  setSeg("segTts", S.tts ? "1" : "0");
}
function setSeg(id, v){
  for (const b of $(id).querySelectorAll("button")) b.classList.toggle("on", b.dataset.v === v);
}

/* ==========================================================================
   事件
   ========================================================================== */
boardEl.addEventListener("click", e => {
  const el = e.target.closest ? e.target.closest(".tile") : null;
  if (!el) return;
  const id = +el.dataset.id;
  const t = B.all.find(x => x.id === id);
  if (t) onTap(t);
});

for (const b of document.querySelectorAll("#tabs button")) {
  b.onclick = () => { Audio2.wake(); showScreen(b.dataset.scr); };
}

$("btnSet").onclick = () => { renderSettings(); openOvl("ovlSet"); };
$("ovlSet").onclick = e => { if (e.target === $("ovlSet")) closeAll(); };
$("ovlPick").onclick = e => { if (e.target === $("ovlPick")) closeAll(); };
$("pickClear").onclick = () => {
  if (pickingPlot >= 0) { S.plots[pickingPlot] = null; saveNow(); }
  closeAll();
  renderGarden();
};

$("lawn").addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest(".plot") : null;
  if (!b) return;
  Audio2.wake();
  openPick(+b.dataset.i);
});

for (const b of document.querySelectorAll("#segSize button")) {
  b.onclick = () => {
    S.cols = +b.dataset.c; S.rows = +b.dataset.r;
    saveNow(); renderSettings(); buildBoard(); updateHud();
    toast("棋盘改成 " + S.cols + "×" + S.rows + " 了", 1400);
  };
}
for (const b of document.querySelectorAll("#segMusic button")) {
  b.onclick = () => { S.music = b.dataset.v === "1"; saveNow(); Music.apply(); renderSettings(); };
}
for (const b of document.querySelectorAll("#segSfx button")) {
  b.onclick = () => { S.sfx = b.dataset.v === "1"; saveNow(); renderSettings(); if (S.sfx) Sfx.soft(); };
}
for (const b of document.querySelectorAll("#segTts button")) {
  b.onclick = () => { S.tts = b.dataset.v === "1"; saveNow(); renderSettings(); if (S.tts) TTS.say("hello"); };
}

$("btnReset").onclick = () => {
  if (!confirm("清空所有进度？花和阳光都没了。")) return;
  S = JSON.parse(JSON.stringify(DEFAULTS));
  saveNow();
  combo = 0;
  closeAll();
  buildBoard(); updateHud(); renderSettings(); renderGarden(); renderDex();
  toast("已经重来了 🌱", 1500);
};

// 卡住不动就提示
let idleT = 0;
setInterval(() => {
  if (!$("scrPlay").classList.contains("on")) { idleT = 0; return; }
  idleT++;
  if (idleT >= 9) { idleT = 0; autoHint(); }
}, 1000);
document.addEventListener("pointerdown", () => { idleT = 0; }, true);

window.addEventListener("resize", () => { if (B.all.length) layoutAll(true); });
window.addEventListener("orientationchange", () => setTimeout(() => { if (B.all.length) layoutAll(true); }, 260));

// 切出去只暂停音乐，绝不动进度（旧版这里会把整关卡掉）
document.addEventListener("visibilitychange", () => {
  try {
    if (document.hidden) {
      if (Audio2.ready) Audio2.musicGain.gain.setTargetAtTime(0.0001, Audio2.ctx.currentTime, .4);
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    } else {
      Music.apply();
    }
  } catch (e) {}
});

document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

/* ==========================================================================
   启动
   ========================================================================== */
buildBoard();
updateHud();
renderGarden();
renderDex();
renderSettings();
setTimeout(() => layoutAll(true), 60);

// 首次进入给一句招呼
setTimeout(() => toast(CONFIG.name + "，" + CONFIG.hello, 2600), 700);

window.__GAME__ = { B: B, S: function(){ return S; }, WORDS: WORDS, onTap: onTap,
                    DECOS: DECOS, comboGet: function(){ return combo; },
                    showScreen: showScreen, config: CONFIG };
</script>
</body>
</html>
