<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2b3d">
<title>荒岛日记 · Island Days</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:#0f2b3d;color:#eaf3f8;overflow:hidden;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,#12314a 0%,#0d2434 100%)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
.hudrow{display:flex;align-items:center;gap:8px}
#dayBadge{font-weight:800;font-size:14px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 13px;white-space:nowrap}
.hudrow .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;padding:0;color:#eaf3f8}
.iconbtn:active{transform:scale(.94)}
#resBar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
#resBar::-webkit-scrollbar{display:none}
.res{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:5px 11px;position:relative}
.res .em{font-size:15px}
.res.flash{animation:rflash .5s ease}
@keyframes rflash{0%{transform:scale(1)}40%{transform:scale(1.18);background:rgba(126,217,155,.35)}100%{transform:scale(1)}}
.res small{font-weight:600;opacity:.6;font-size:11px}

/* ---------- 屏幕 ---------- */
main{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:2px 12px 14px}
.scr.on{display:block}

/* ---------- 岛屿地图 ---------- */
#sea{position:relative;width:100%;aspect-ratio:1/1.08;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,#1d5b7a,#164a66 60%,#123c55);
  box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
#sea::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px);
  animation:seaShift 7s linear infinite}
@keyframes seaShift{from{transform:translateY(0)}to{transform:translateY(9px)}}
#island{position:absolute;left:8%;top:9%;width:84%;height:80%;
  border-radius:52% 44% 47% 55% / 46% 53% 47% 54%;
  background:radial-gradient(ellipse at 42% 34%,#a8d18a,#7fbc6d 42%,#e6d3a2 72%,#dfc793 100%);
  box-shadow:0 0 0 9px rgba(232,216,170,.34),0 0 46px rgba(0,0,0,.32),inset -14px -18px 40px rgba(90,120,60,.28)}
.spot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;
  cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.spot .bub{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:27px;background:rgba(255,255,255,.86);border:3px solid rgba(255,255,255,.95);
  box-shadow:0 6px 16px rgba(20,50,40,.3);transition:transform .16s}
.spot:active .bub{transform:scale(.92)}
.spot .nm{font-size:11.5px;font-weight:800;color:#1e3b2c;background:rgba(255,255,255,.82);
  padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(20,50,40,.18)}
.spot.locked .bub{background:rgba(180,195,205,.85);font-size:22px;filter:grayscale(.4)}
.spot.locked .nm{background:rgba(200,212,220,.85);color:#5b6b76}
.spot.open .bub{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#bottle{position:absolute;font-size:24px;cursor:pointer;animation:bobB 2.2s ease-in-out infinite;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
@keyframes bobB{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}

#goalBar{margin-top:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.55}
#goalBar b{color:#8fe0a8}
#goalBar .lbl{opacity:.62;font-size:11.5px;display:block;margin-bottom:3px;letter-spacing:.04em}

/* ---------- 区域场景 ---------- */
#zoneTop{display:flex;align-items:center;gap:8px;padding:2px 0 9px}
#zoneTop .back{border:0;background:rgba(255,255,255,.12);color:#eaf3f8;border-radius:11px;
  padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
#zoneTop h2{margin:0;font-size:16px;font-weight:800}
#zoneTop .en{opacity:.5;font-size:11px;font-weight:600;display:block}
#scene{position:relative;width:100%;aspect-ratio:1/1.18;border-radius:18px;overflow:hidden;
  box-shadow:inset 0 0 50px rgba(0,0,0,.28)}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;
  padding:0;font-size:36px;line-height:1;transition:transform .15s;filter:drop-shadow(0 4px 7px rgba(0,0,0,.28))}
.node:active{transform:translate(-50%,-50%) scale(.9)}
.node.cool{opacity:.24;filter:grayscale(1);pointer-events:none}
.node .tagname{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
  font-size:9px;font-weight:800;color:#fff;background:rgba(0,0,0,.42);padding:1px 6px;
  border-radius:999px;white-space:nowrap;font-family:inherit}
.node.pop{animation:npop .34s ease}
@keyframes npop{0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-50%) scale(1.28)}100%{transform:translate(-50%,-50%) scale(1)}}
#zoneHint{margin-top:10px;font-size:12.5px;opacity:.66;line-height:1.6;text-align:center}

/* ---------- 营地 ---------- */
.card{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);
  border-radius:16px;padding:12px;margin-bottom:11px}
.card h3{margin:0 0 9px;font-size:14px;display:flex;align-items:center;gap:6px}
.card h3 .n{margin-left:auto;font-size:11.5px;opacity:.58;font-weight:600}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0}
.brow+.brow{border-top:1px dashed rgba(255,255,255,.11)}
.brow .em{font-size:25px;width:32px;text-align:center;flex:0 0 auto}
.brow .txt{flex:1;min-width:0}
.brow .txt b{font-size:14px;font-weight:800}
.brow .txt b i{font-style:normal;font-size:11px;opacity:.5;font-weight:600;margin-left:5px}
.brow .txt span{display:block;font-size:11.5px;opacity:.62;margin-top:2px}
.brow .cost{font-size:11px;opacity:.85;margin-top:3px;line-height:1.5}
.brow .cost i{font-style:normal;margin-right:7px;white-space:nowrap}
.brow .cost i.no{color:#ff97a8}
.brow .act{border:0;border-radius:999px;padding:8px 15px;font-weight:800;font-size:12.5px;
  background:linear-gradient(180deg,#63d28b,#3fae6a);color:#fff;cursor:pointer;flex:0 0 auto;
  box-shadow:0 3px 11px rgba(63,174,106,.34)}
.brow .act:active{transform:scale(.95)}
.brow .act.no{background:rgba(255,255,255,.11);color:rgba(255,255,255,.42);box-shadow:none}
.brow .act.done{background:rgba(255,255,255,.14);color:#8fe0a8;box-shadow:none}
#campScene{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;
  padding:8px 6px;border-radius:13px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);cursor:pointer;animation:chipIn .34s cubic-bezier(.3,1.3,.5,1)}
@keyframes chipIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.chip:active{transform:scale(.94)}
.chip .ce{font-size:23px;line-height:1.15}
.chip .cn{font-size:9.5px;font-weight:700;opacity:.78;white-space:nowrap}
.farm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{aspect-ratio:1;border-radius:13px;border:2px dashed rgba(255,255,255,.24);
  background:rgba(120,90,60,.35);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:26px;cursor:pointer;color:#eaf3f8;padding:0}
.plot.ready{border-style:solid;border-color:#8fe0a8;background:rgba(90,170,110,.3);
  animation:bob 1.8s ease-in-out infinite}
.plot small{font-size:9.5px;opacity:.72;font-weight:700}

/* ---------- 日记 ---------- */
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.dcard{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);
  border-radius:12px;padding:9px 11px;cursor:pointer;display:flex;align-items:center;gap:9px}
.dcard:active{transform:scale(.97)}
.dcard .em{font-size:22px}
.dcard .tx{min-width:0}
.dcard .en{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .zh{font-size:11.5px;opacity:.62;margin-top:1px}
.dcard.locked{opacity:.3}

/* ---------- 底部 ---------- */
#tabs{flex:0 0 auto;display:flex;gap:6px;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
#tabs button{flex:1;border:0;border-radius:14px;padding:9px 4px 7px;background:transparent;
  color:#8fb0c4;font-size:11px;font-weight:700;cursor:pointer;line-height:1.5}
#tabs button .i{display:block;font-size:19px;line-height:1.15;opacity:.62}
#tabs button.on{background:rgba(255,255,255,.13);color:#eaf3f8}
#tabs button.on .i{opacity:1}
#tabs button:active{transform:scale(.96)}

/* ---------- 浮层 ---------- */
.ovl{position:fixed;inset:0;background:rgba(6,18,26,.6);backdrop-filter:blur(3px);display:none;
  align-items:flex-end;justify-content:center;z-index:60}
.ovl.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:84vh;overflow-y:auto;background:#14324a;
  border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  animation:up .26s cubic-bezier(.3,1.2,.5,1);box-shadow:0 -14px 44px rgba(0,0,0,.5)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .sub{opacity:.6;font-size:12.5px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
.row+.row{border-top:1px solid rgba(255,255,255,.1)}
.row .lbl{flex:1;font-weight:700}
.seg{display:flex;gap:6px}
.seg button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:11px;
  padding:8px 13px;font-weight:700;font-size:13px;color:#cfe2ec;cursor:pointer}
.seg button.on{background:#3fae6a;border-color:#3fae6a;color:#fff}
.danger{width:100%;margin-top:14px;border:1px solid rgba(255,120,140,.4);
  background:rgba(255,90,120,.12);color:#ff9db0;border-radius:12px;padding:11px;
  font-weight:800;font-size:13.5px;cursor:pointer}
#endSheet{text-align:center}
#endSheet .big{font-size:52px;margin:6px 0 10px}
#endSheet p{line-height:1.75;font-size:14px;opacity:.9}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);
  transform:translate(-50%,-14px);background:rgba(10,28,40,.95);color:#fff;padding:10px 18px;
  border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;
  transition:.26s;z-index:90;max-width:88vw;text-align:center;
  border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 26px rgba(0,0,0,.45)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fx{position:fixed;pointer-events:none;z-index:80;font-size:15px;font-weight:800;color:#ffe9a8;
  text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap}
.pt{position:fixed;pointer-events:none;z-index:80;font-size:16px;line-height:1}
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hudrow">
      <div id="dayBadge">第 1 天</div>
      <div class="sp"></div>
      <button class="iconbtn" id="btnSound" aria-label="声音">🌊</button>
      <button class="iconbtn" id="btnSet" aria-label="设置">⚙️</button>
    </div>
    <div id="resBar"></div>
  </div>

  <main>
    <!-- ===== 地图 ===== -->
    <section class="scr on" id="scrMap">
      <div id="sea">
        <div id="island"></div>
      </div>
      <div id="goalBar"><span class="lbl">下一步</span><div id="goalTxt">正在看海…</div></div>
    </section>

    <!-- ===== 区域 ===== -->
    <section class="scr" id="scrZone">
      <div id="zoneTop">
        <button class="back" id="btnBack">‹ 地图</button>
        <h2 id="zoneName">沙滩<span class="en">Beach</span></h2>
      </div>
      <div id="scene"></div>
      <div id="zoneHint"></div>
    </section>

    <!-- ===== 营地 ===== -->
    <section class="scr" id="scrCamp">
      <div class="card">
        <h3>🌙 过一天<span class="n" id="sleepHint"></span></h3>
        <div class="brow">
          <div class="em">🛌</div>
          <div class="txt"><b>睡一觉<span class="en"></span></b>
            <span>采集点全部恢复 · 庄稼长大 · 鸡羊产出</span></div>
          <button class="act" id="btnSleep">睡觉</button>
        </div>
      </div>
      <div class="card">
        <h3>🏕️ 我的营地<span class="n">点一下能听读音</span></h3>
        <div id="campScene"></div>
      </div>
      <div class="card">
        <h3>🔨 建造</h3>
        <div id="buildList"></div>
      </div>
      <div class="card">
        <h3>🎐 手工<span class="n">纯好看，不挡进度</span></h3>
        <div id="craftList"></div>
      </div>
      <div class="card" id="lifeCard" style="display:none">
        <h3>🌱 生活</h3>
        <div id="lifeBox"></div>
      </div>
    </section>

    <!-- ===== 日记 ===== -->
    <section class="scr" id="scrDiary">
      <div class="card">
        <h3>🏝️ 岛上的东西<span class="n" id="diaryCount"></span></h3>
        <div class="dgrid" id="diaryGrid"></div>
      </div>
      <div class="card">
        <h3>✍️ 从海里捞到的词<span class="n" id="wordCount"></span></h3>
        <div class="dgrid" id="wordGrid"></div>
      </div>
    </section>
  </main>

  <nav id="tabs">
    <button class="on" data-scr="Map"><span class="i">🗺️</span>地图</button>
    <button data-scr="Camp"><span class="i">🏕️</span>营地</button>
    <button data-scr="Diary"><span class="i">📖</span>日记</button>
  </nav>
</div>

<!-- 设置 -->
<div class="ovl" id="ovlSet"><div class="sheet">
  <h2>设置</h2>
  <div class="sub">自动保存，随便改</div>
  <div class="row"><span class="lbl">背景声音</span>
    <div class="seg" id="segAmb">
      <button data-v="waves">🌊 海浪</button>
      <button data-v="rain">🌧 雨声</button>
      <button data-v="off">静音</button>
    </div>
  </div>
  <div class="row"><span class="lbl">音效</span>
    <div class="seg" id="segSfx"><button data-v="1">开</button><button data-v="0">关</button></div>
  </div>
  <div class="row"><span class="lbl">采集时朗读英文</span>
    <div class="seg" id="segTts"><button data-v="1">开</button><button data-v="0">关</button></div>
  </div>
  <button class="danger" id="btnReset">清空进度，重新漂流一次</button>
</div></div>

<!-- 漂流瓶 -->
<div class="ovl" id="ovlBottle"><div class="sheet">
  <h2>🍾 捡到一个漂流瓶</h2>
  <div class="sub">里面是一张单词卡</div>
  <div style="text-align:center;padding:14px 0 18px">
    <div id="botEn" style="font-size:26px;font-weight:900;letter-spacing:.02em"></div>
    <div id="botZh" style="font-size:16px;opacity:.75;margin-top:7px"></div>
    <button id="botSay" style="margin-top:16px;border:0;border-radius:999px;padding:10px 22px;
      font-weight:800;font-size:13.5px;background:linear-gradient(180deg,#63d28b,#3fae6a);
      color:#fff;cursor:pointer">🔊 再听一遍</button>
  </div>
</div></div>

<!-- 通关 -->
<div class="ovl" id="ovlEnd"><div class="sheet" id="endSheet">
  <div class="big">⛵</div>
  <h2>木筏造好了</h2>
  <p id="endMsg"></p>
</div></div>

<div id="toast"></div>

<script>

   配置
   ========================================================================== */

const WORDS = [

["available","可获得的"],["avoid","避免"],["aware","意识到的"],["balance","平衡"],
["barrier","障碍"],["behave","表现"],["benefit","益处"],["brief","简短的"],
["broad","宽阔的"],["budget","预算"],["calculate","计算"],["campaign","运动"],
["capable","有能力的"],["capture","捕获"],["career","生涯"],["casual","随意的"],
["cease","停止"],["challenge","挑战"],["character","性格"],["claim","声称"],
["classify","分类"],["client","客户"],["combine","结合"],["comment","评论"],
["commercial","商业的"],["commit","承诺；犯"],["communicate","交流"],["compare","比较"],

         berry:0, clay:0, crystal:0, flower:0, feather:0, spring:0, egg:0, milk:0 },

let S = load();
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const o = JSON.parse(raw);
    const s = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), o);
    s.res = Object.assign({}, DEFAULTS.res, o.res || {});
    s.zones = Object.assign({ beach:true }, o.zones || {});
    if (!Array.isArray(s.farm) || s.farm.length !== 3) s.farm = [null, null, null];
    if (!Array.isArray(s.seen)) s.seen = [];
    if (!Array.isArray(s.words)) s.words = [];
    return s;
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULTS)); }
}
let saveTimer = null;
function save(){
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 240);
}
function saveNow(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ==========================================================================
   声音 —— 全部实时合成
   海浪 = 布朗噪声 + 慢速涌浪调制；雨声 = 白噪声 + 雨滴 + 远雷
   ========================================================================== */
const Sound = {
  ctx:null, ready:false, bus:null, master:null, mode:null, parts:[], timers:[],

  boot(){
    if (this.ready) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      const ctx = new AC();
      this.ctx = ctx;
      this.master = ctx.createGain();
      this.master.gain.value = 0.85;
      this.master.connect(ctx.destination);

      const conv = ctx.createConvolver();
      conv.buffer = this.impulse(2.4, 2.4);
      const wet = ctx.createGain();
      wet.gain.value = 0.3;
      this.bus = ctx.createGain();
      this.bus.gain.value = 0.0001;
      this.bus.connect(this.master);
      this.bus.connect(conv);
      conv.connect(wet);
      wet.connect(this.master);

      this.sfxBus = ctx.createGain();
      this.sfxBus.gain.value = 0.6;
      this.sfxBus.connect(this.master);
      this.sfxBus.connect(conv);

      this.brownBuf = this.noise(11, "brown");
      this.whiteBuf = this.noise(9, "white");
      this.ready = true;
      return true;
    } catch (e) { return false; }
  },

  impulse(sec, decay){
    const ctx = this.ctx, rate = ctx.sampleRate, len = Math.floor(rate * sec);
    const b = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  },

  /* 生成一段无缝循环的噪声 */
  noise(seconds, kind){
    const ctx = this.ctx, rate = ctx.sampleRate;
    const n = Math.floor(rate * seconds), fade = Math.floor(rate * 0.6);
    const tmp = new Float32Array(n + fade);
    if (kind === "brown") {
      let last = 0;
      for (let i = 0; i < n + fade; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        tmp[i] = last * 3.2;
      }
    } else {
      for (let i = 0; i < n + fade; i++) tmp[i] = Math.random() * 2 - 1;
    }
    // 把尾巴交叉淡入开头，循环时听不出接缝
    for (let i = 0; i < fade; i++) {
      const k = i / fade;
      tmp[i] = tmp[i] * k + tmp[n + i] * (1 - k);
    }
    const buf = ctx.createBuffer(1, n, rate);
    buf.getChannelData(0).set(tmp.subarray(0, n));
    return buf;
  },

  wake(){
    if (!this.boot()) return;
    try { if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) {}
    if (!this.mode) this.setAmb(S.amb);
  },

  teardown(){
    for (const p of this.parts) { try { p.stop(); } catch (e) {} }
    for (const t of this.timers) clearInterval(t);
    this.parts = []; this.timers = []; this.mode = null;
  },

  setAmb(mode){
    if (!this.ready) { this.mode = mode; return; }
    this.teardown();
    this.mode = mode;
    const ctx = this.ctx;
    if (mode === "off") {
      this.bus.gain.setTargetAtTime(0.0001, ctx.currentTime, .5);
      return;
    }
    this.bus.gain.setTargetAtTime(0.5, ctx.currentTime, 1.6);

    if (mode === "waves") {
      const src = ctx.createBufferSource();
      src.buffer = this.brownBuf; src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 540; lp.Q.value = 0.6;
      const g = ctx.createGain(); g.gain.value = 0.19;
      const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.072;
      const lfoG = ctx.createGain(); lfoG.gain.value = 0.13;
      lfo.connect(lfoG); lfoG.connect(g.gain);

      const spray = ctx.createBufferSource();
      spray.buffer = this.whiteBuf; spray.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 1450; bp.Q.value = 0.5;
      const sg = ctx.createGain(); sg.gain.value = 0.016;
      const lfo2 = ctx.createOscillator(); lfo2.type = "sine"; lfo2.frequency.value = 0.105;
      const lfo2G = ctx.createGain(); lfo2G.gain.value = 0.014;
      lfo2.connect(lfo2G); lfo2G.connect(sg.gain);

      src.connect(lp); lp.connect(g); g.connect(this.bus);
      spray.connect(bp); bp.connect(sg); sg.connect(this.bus);
      src.start(); spray.start(); lfo.start(); lfo2.start();
      this.parts = [src, spray, lfo, lfo2];

    } else if (mode === "rain") {
      const src = ctx.createBufferSource();
      src.buffer = this.whiteBuf; src.loop = true;
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 950;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 6800;
      const g = ctx.createGain(); g.gain.value = 0.1;
      src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(this.bus);
      src.start();
      this.parts = [src];
      this.timers.push(setInterval(() => this.drip(), 620));
      this.timers.push(setInterval(() => this.thunder(), 34000 + Math.random() * 26000));
    }
  },

  /* 雨滴：很轻的一声高频点 */
  drip(){
    if (!this.ready || this.mode !== "rain") return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.value = 900 + Math.random() * 1500;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.02, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + 0.12);
  },

  /* 远雷：低沉的滚动 */
  thunder(){
    if (!this.ready || this.mode !== "rain") return;
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = this.brownBuf;
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 150; lp.Q.value = 1.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.42, t + 1.4);
    g.gain.linearRampToValueAtTime(0.0001, t + 5.5);
    src.connect(lp); lp.connect(g); g.connect(this.bus);
    src.start(t); src.stop(t + 6);
  },

  tone(freq, o){
    if (!this.ready || !S.sfx || !this.sfxBus) return;
    o = o || {};
    const ctx = this.ctx, t = ctx.currentTime;
    const dur = o.dur || 0.4, gain = o.gain || 0.13;
    const osc = ctx.createOscillator();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + (o.atk || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.sfxBus);
    osc.start(t); osc.stop(t + dur + 0.05);
  },

  thunk(){ if (!this.ready || !S.sfx) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = this.whiteBuf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    src.connect(lp); lp.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t + 0.3);
  }
};

const Sfx = {
  gather(){ Sound.thunk(); Sound.tone(520 + rnd(160), { dur:.2, gain:.09, type:"triangle" }); },
  build(){ [0,4,7,12].forEach((s,i) => setTimeout(() =>
    Sound.tone(261.63 * Math.pow(2, s/12), { dur:.6, gain:.11 }), i*90)); },
  unlock(){ [0,4,7,12,19].forEach((s,i) => setTimeout(() =>
    Sound.tone(261.63 * Math.pow(2, s/12), { dur:.8, gain:.12 }), i*110)); },
  plant(){ Sound.tone(392, { dur:.3, gain:.1, type:"sine" }); },
  harvest(){ [0,7,12].forEach((s,i) => setTimeout(() =>
    Sound.tone(392 * Math.pow(2, s/12), { dur:.45, gain:.1 }), i*80)); },
  deny(){ Sound.tone(180, { dur:.22, gain:.1, type:"triangle" }); },
  sleep(){ Sound.tone(330, { dur:1.1, gain:.09, glide:165, type:"sine" }); }
};

const TTS = {
  voice:null,
  pick(){
    try {
      if (!("speechSynthesis" in window)) return;
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      for (const name of ["Google US English","Microsoft Aria","Microsoft Zira","Samantha"]) {
        const v = vs.find(x => x.name && x.name.indexOf(name) >= 0);
        if (v) { this.voice = v; return; }
      }
      this.voice = vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang)) || null;
    } catch (e) {}
  },
  say(text, rate){
    if (!S.tts) return;
    try {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate || 0.86;
      if (this.voice) u.voice = this.voice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
};
try {
  if ("speechSynthesis" in window) {
    TTS.pick();
    speechSynthesis.onvoiceschanged = () => TTS.pick();
  }
} catch (e) {}

function visibleRes(){

}
function renderRes(){
  const bar = $("resBar");
  const want = visibleRes();
  const have = [...bar.children].map(c => c.dataset.k);
  if (want.join(",") !== have.join(",")) {

                    '<small>' + esc(RES[k].zh) + '</small>';

  }
  for (const c of bar.children) {
    const k = c.dataset.k;
    const v = c.querySelector(".v");

function flashRes(k){

function renderMap(){
  const sea = $("sea");
  for (const el of [...sea.querySelectorAll(".spot, #bottle")]) el.remove();

  for (const z of ZONES) {
    const open = !!S.zones[z.id];
    const b = document.createElement("button");
    b.className = "spot " + (open ? "open" : "locked");
    b.style.left = ({ beach:"27%", jungle:"40%", cave:"76%", peak:"56%" })[z.id];
    b.style.top  = ({ beach:"76%", jungle:"46%", cave:"58%", peak:"20%" })[z.id];
    b.innerHTML = '<span class="bub">' + (open ? z.e : "🔒") + '</span>' +
                  '<span class="nm">' + esc(open ? z.n : "???") + '</span>';
    b.onclick = () => {
      Sound.wake();
      if (!S.zones[z.id]) { Sfx.deny(); toast("还没路过去。先造点东西。", 1500); return; }
      enterZone(z.id);
    };
    sea.appendChild(b);
  }

  // 漂流瓶：一天漂来一个。位置当天固定，而且只在外圈的海面上，
  // 免得压在区域按钮底下点不着。
  if (S.bottleDay < S.day && WORDS.length) {
    if (!S.bottlePos || !S.bottlePos.length) {
      const edge = rnd(4), t = 22 + Math.random() * 56;
      S.bottlePos = edge === 0 ? [4, t] : edge === 1 ? [96, t]
                  : edge === 2 ? [t, 4] : [t, 96];
      save();
    }
    const b = document.createElement("div");
    b.id = "bottle";
    b.textContent = "🍾";
    b.style.left = S.bottlePos[0] + "%";
    b.style.top = S.bottlePos[1] + "%";
    b.onclick = () => {
      Sound.wake();
      // 优先给还没捞到过的词
      const fresh = WORDS.filter(w => S.words.indexOf(w.en) < 0);
      const w = fresh.length ? pick(fresh) : pick(WORDS);
      $("botEn").textContent = w.en;
      $("botZh").textContent = w.zh;
      $("botSay").onclick = () => TTS.say(w.en);
      openOvl("ovlBottle");
      TTS.say(w.en);
      S.bottleDay = S.day;
      S.bottlePos = null;
      if (S.words.indexOf(w.en) < 0) S.words.push(w.en);
      saveNow();
      renderDiary();
      b.remove();
    };
    sea.appendChild(b);
  }

  renderGoal();
}

function renderGoal(){
  // 只指路指得通的：缺的资源必须现在就能采到，
  // 否则会出现「让你去造要竹子的羊圈，而竹子还没解锁」这种死指路
  const next = BUILDS.find(b => !S.built[b.id] && !firstMissingZone(b.cost));
  const el = $("goalTxt");
  if (!next) { el.innerHTML = "岛上该建的都建好了 🌿"; return; }
  const can = affordable(next.cost);
  const parts = [];
  for (const k in next.cost) {
    const need = next.cost[k], have = S.res[k];
    parts.push('<i style="font-style:normal;' + (have >= need ? "opacity:.6" : "color:#ff97a8") + '">' +
               RES[k].e + " " + have + "/" + need + '</i>');
  }
  el.innerHTML = '造 <b>' + next.e + " " + esc(next.n) + "</b>（" + esc(next.d) + "）" +
                 '<div style="margin-top:5px">' + parts.join(" &nbsp; ") + "</div>" +
                 (can ? '<div style="margin-top:6px;color:#8fe0a8">材料够了，去营地造 →</div>' : "");
}

/* ==========================================================================

let curZone = null;
const cool = {};      // 采集点冷却（不存档，重开就恢复）

function enterZone(id){
  curZone = ZONES.find(z => z.id === id);
  if (!curZone) return;
  $("zoneName").innerHTML = esc(curZone.n) + '<span class="en">' + esc(curZone.en) + "</span>";
  const scene = $("scene");
  scene.style.background = curZone.sky;
  scene.innerHTML = "";
  curZone.nodes.forEach((nd, i) => {
    const key = id + ":" + i;
    const b = document.createElement("button");
    b.className = "node";
    b.dataset.key = key;
    b.dataset.r = nd.r;
    b.style.left = nd.p[0] + "%";
    b.style.top = nd.p[1] + "%";
    b.innerHTML = RES[nd.r].e +
      '<span class="tagname">' + esc(RES[nd.r].en) + "</span>";
    if (cool[key]) b.classList.add("cool");
    scene.appendChild(b);
  });
  $("zoneHint").textContent = curZone.hint;
  showScreen("Zone");
  renderRes();
}

function onGather(btn){
  if (!btn || btn.classList.contains("cool")) return;
  Sound.wake();
  const key = btn.dataset.key, r = btn.dataset.r;

  const isNew = S.res[r] === 0;
  const amount = 1 + (Math.random() < 0.3 ? 1 : 0);
  S.res[r] += amount;
  S.gathered++;

  learn(r);
  save();

  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  btn.classList.add("cool");
  cool[key] = true;
  setTimeout(() => {
    cool[key] = false;
    if (curZone && btn.parentNode) btn.classList.remove("cool");
  }, 3000);

  Sfx.gather();
  buzz(9);
  const rc = btn.getBoundingClientRect();
  flyText(rc.left + rc.width / 2, rc.top, "+" + amount + " " + RES[r].e);
  petal(rc.left + rc.width / 2, rc.top + rc.height / 2);
  renderRes();
  flashRes(r);
  TTS.say(RES[r].en);
  if (isNew) { toast("第一次见到 " + RES[r].en + " · " + RES[r].zh, 1900); renderDiary(); }
  renderGoal();
}

/* ==========================================================================
   营地
   ========================================================================== */
function affordable(cost){
  for (const k in cost) if (S.res[k] < cost[k]) return false;
  return true;
}

/* 见过一次就记进日记。蛋和奶是睡觉产出的，不走采集那条路，所以两边都要调它。 */
function learn(k){
  if (RES[k] && S.seen.indexOf(RES[k].en) < 0) S.seen.push(RES[k].en);
}

/* 现在能采到哪些资源 —— 决定「还差材料」和「这材料你根本还没地方弄」是两回事 */
function reachable(){
  const set = {};
  for (const z of ZONES)
    if (S.zones[z.id]) for (const n of z.nodes) set[n.r] = true;
  return set;
}
function firstMissingZone(cost){
  const have = reachable();
  for (const k in cost) {
    if (have[k]) continue;
    for (const z of ZONES)
      if (!S.zones[z.id])
        for (const n of z.nodes)
          if (n.r === k) return z;
  }
  return null;
}

function buildRow(item, verb){
  const done = !!S.built[item.id];
  const blocked = done ? null : firstMissingZone(item.cost);
  const can = !done && !blocked && affordable(item.cost);

  const row = document.createElement("div");
  row.className = "brow";

  const em = document.createElement("div");
  em.className = "em";
  em.textContent = done ? item.e : "❔";
  row.appendChild(em);

  const tx = document.createElement("div");
  tx.className = "txt";
  let inner = "<b>" + esc(done ? item.n : "???") + "<i>" + esc(done ? item.en : "") + "</i></b>" +
              "<span>" + esc(item.d) + "</span>";
  if (!done) {
    const ps = [];
    for (const k in item.cost) {
      const ok = S.res[k] >= item.cost[k];
      ps.push('<i class="' + (ok ? "" : "no") + '">' + RES[k].e + " " +
              S.res[k] + "/" + item.cost[k] + "</i>");
    }
    inner += '<div class="cost">' + ps.join("") + "</div>";
    if (blocked)
      inner += '<div class="cost" style="color:#ffd07a">材料在「' + esc(blocked.n) + "」，还没路过去</div>";
  }
  tx.innerHTML = inner;
  row.appendChild(tx);

  const act = document.createElement("button");
  act.className = "act";
  if (done) { act.classList.add("done"); act.textContent = "已完成"; act.disabled = true; }
  else if (can) { act.textContent = verb; act.onclick = () => doBuild(item); }
  else { act.classList.add("no"); act.textContent = blocked ? "还没路" : "材料不够"; act.disabled = true; }
  row.appendChild(act);
  return row;
}

function renderCamp(){
  const list = $("buildList");
  list.innerHTML = "";
  for (const b of BUILDS) list.appendChild(buildRow(b, "建造"));

  const cl = $("craftList");
  cl.innerHTML = "";
  for (const c of CRAFTS) cl.appendChild(buildRow(c, "做"));

  $("sleepHint").textContent = "现在是第 " + S.day + " 天";
  renderCampScene();
  renderLife();
}

/* 营地一览：建过的东西按顺序排出来。这是「养成」里最直给的那部分 —— 看得见。 */
function renderCampScene(){
  const box = $("campScene");
  box.innerHTML = "";
  const items = BUILDS.concat(CRAFTS).filter(x => S.built[x.id]);
  if (!items.length) {
    box.innerHTML = '<div style="opacity:.5;font-size:12.5px;line-height:1.6">' +
                    "这里还空着。<br>先去沙滩捡点木头 🪵 吧</div>";
    return;
  }
  for (const it of items) {
    const c = document.createElement("div");
    c.className = "chip";
    c.innerHTML = '<span class="ce">' + it.e + '</span><span class="cn">' + esc(it.n) + "</span>";
    c.onclick = () => { Sound.wake(); TTS.say(it.en); };
    box.appendChild(c);
  }
}

function doBuild(b){
  if (S.built[b.id] || !affordable(b.cost)) { Sfx.deny(); return; }
  Sound.wake();
  for (const k in b.cost) S.res[k] -= b.cost[k];
  S.built[b.id] = true;

  if (b.unlock === "win") { S.won = true; saveNow(); showEnd(); return; }

  if (b.unlock) {
    S.zones[b.unlock] = true;
    const z = ZONES.find(x => x.id === b.unlock);
    Sfx.unlock();
    confetti(26);
    buzz([20, 40, 20]);
    toast("🎉 " + b.e + " " + b.n + " 建好了！<br>通往「" + z.n + "」的路开了", 3000);
  } else {
    Sfx.build();
    confetti(12);
    toast(b.e + " " + b.n + " 建好了", 1700);
  }
  saveNow();
  renderRes(); renderCamp(); renderGoal(); renderMap();
}

function renderLife(){
  const card = $("lifeCard");
  const box = $("lifeBox");
  const hasFarm = !!S.built.farm, hasCoop = !!S.built.coop, hasPen = !!S.built.pen;
  if (!hasFarm && !hasCoop && !hasPen) { card.style.display = "none"; return; }
  card.style.display = "";
  box.innerHTML = "";

  if (hasFarm) {
    const t = document.createElement("div");
    t.style.cssText = "font-size:12.5px;opacity:.7;margin-bottom:7px";
    t.textContent = "农田 · 种浆果（1 颗浆果 = 1 块地，睡一觉就长好，收 3 颗）";
    box.appendChild(t);
    const g = document.createElement("div");
    g.className = "farm";
    S.farm.forEach((slot, i) => {
      const p = document.createElement("button");
      p.className = "plot";
      p.dataset.i = i;
      if (!slot) { p.innerHTML = '<span>➕</span><small>空地</small>'; }
      else if (S.day - slot.day >= 1) { p.classList.add("ready"); p.innerHTML = '<span>🫐</span><small>可以收了</small>'; }
      else { p.innerHTML = '<span>🌱</span><small>长着…</small>'; }
      g.appendChild(p);
    });
    box.appendChild(g);
  }

  const rows = [];
  if (hasCoop) rows.push({ e:"🐔", t:"鸡舍", en:"Coop", s:"每天自动下一个蛋 · 已攒 " + S.res.egg + " 个" });
  if (hasPen)  rows.push({ e:"🐐", t:"羊圈", en:"Pen",  s:"每天自动挤一瓶奶 · 已攒 " + S.res.milk + " 瓶" });
  for (const r of rows) {
    const d = document.createElement("div");
    d.className = "brow";
    d.innerHTML = '<div class="em">' + r.e + '</div><div class="txt"><b>' + esc(r.t) +
                  '<i>' + esc(r.en) + '</i></b><span>' + esc(r.s) + "</span></div>";
    box.appendChild(d);
  }
}

function onFarmTap(i){
  Sound.wake();
  const slot = S.farm[i];
  if (!slot) {
    if (S.res.berry < 1) { Sfx.deny(); toast("没有浆果种子。去丛林采 🫐", 1600); return; }
    S.res.berry -= 1;
    S.farm[i] = { day: S.day };
    Sfx.plant();
    toast("种下了，睡一觉就长好 🌱", 1500);
  } else if (S.day - slot.day >= 1) {
    S.farm[i] = null;
    S.res.berry += 3;
    Sfx.harvest();
    confetti(8);
    toast("收了 3 颗 🫐", 1400);
  } else {
    Sfx.deny();
    toast("还没长好，去睡一觉", 1400);
    return;
  }
  saveNow();
  renderRes(); renderLife(); renderGoal();
}

function doSleep(){
  Sound.wake();
  Sfx.sleep();
  S.day++;
  for (const k in cool) cool[k] = false;
  if (S.built.coop) { S.res.egg += 1; learn("egg"); }
  if (S.built.pen)  { S.res.milk += 1; learn("milk"); }
  if (S.built.well && S.day % 2 === 0) { S.res.spring += 1; learn("spring"); }
  saveNow();
  toast("🌙 第 " + S.day + " 天", 1600);
  if (curZone) for (const n of document.querySelectorAll("#scene .node")) n.classList.remove("cool");
  renderRes(); renderCamp(); renderGoal(); renderMap();
}

/* ==========================================================================
   日记
   ========================================================================== */
const DIARY = ["wood","stone","fiber","shell","coconut","bamboo","vine","berry","clay",
               "crystal","flower","feather","spring","egg","milk"];
function renderDiary(){
  const g = $("diaryGrid");
  g.innerHTML = "";
  let n = 0;
  for (const k of DIARY) {
    const d = RES[k];
    const has = S.seen.indexOf(d.en) >= 0;
    const c = document.createElement("div");
    c.className = "dcard" + (has ? "" : " locked");
    c.innerHTML = '<div class="em">' + (has ? d.e : "❔") + '</div><div class="tx">' +
                  '<div class="en">' + esc(has ? d.en : "• • •") + "</div>" +
                  '<div class="zh">' + esc(has ? d.zh : "还没见过") + "</div></div>";
    if (has) { n++; c.onclick = () => { Sound.wake(); TTS.say(d.en); }; }
    g.appendChild(c);
  }
  $("diaryCount").textContent = n + " / " + DIARY.length;

  // 捞到的词
  const wg = $("wordGrid");
  wg.innerHTML = "";
  const got = WORDS.filter(w => S.words.indexOf(w.en) >= 0);
  for (const w of got) {
    const c = document.createElement("div");
    c.className = "dcard";
    c.innerHTML = '<div class="em">✍️</div><div class="tx">' +
                  '<div class="en">' + esc(w.en) + "</div>" +
                  '<div class="zh">' + esc(w.zh) + "</div></div>";
    c.onclick = () => { Sound.wake(); TTS.say(w.en); };
    wg.appendChild(c);
  }
  if (!got.length) {
    const c = document.createElement("div");
    c.className = "dcard locked";
    c.style.gridColumn = "span 2";
    c.innerHTML = '<div class="em">🍾</div><div class="tx"><div class="en">还没有</div>' +
                  '<div class="zh">去地图上捡漂流瓶</div></div>';
    wg.appendChild(c);
  } else if (got.length < WORDS.length) {
    const c = document.createElement("div");
    c.className = "dcard locked";
    c.style.gridColumn = "span 2";
    c.innerHTML = '<div class="em">🌊</div><div class="tx"><div class="en">还有 ' +
                  (WORDS.length - got.length) + ' 个词</div>' +
                  '<div class="zh">一天漂来一个瓶子</div></div>';
    wg.appendChild(c);
  }
  $("wordCount").textContent = got.length + " / " + WORDS.length;
  return n;
}

/* ==========================================================================
   特效
   ========================================================================== */
function flyText(x, y, txt){
  const d = document.createElement("div");
  d.className = "fx";
  d.textContent = txt;
  d.style.left = x + "px";
  d.style.top = y + "px";
  document.body.appendChild(d);
  try {
    d.animate(
      [{ transform:"translate(-50%,-50%) scale(.7)", opacity:0 },
       { transform:"translate(-50%,-130%) scale(1.12)", opacity:1, offset:.3 },
       { transform:"translate(-50%,-280%) scale(1)", opacity:0 }],
      { duration: 950, easing:"cubic-bezier(.2,.8,.3,1)" }
    ).onfinish = () => d.remove();
  } catch (e) { setTimeout(() => d.remove(), 900); }
}
const PETALS = ["🌿","✨","🍃","💧","🌺"];
function petal(x, y){
  const d = document.createElement("div");
  d.className = "pt";
  d.textContent = pick(PETALS);
  d.style.left = x + "px";
  d.style.top = y + "px";
  document.body.appendChild(d);
  const dx = (Math.random() - .5) * 130, dy = 50 + Math.random() * 90;
  try {
    d.animate(
      [{ transform:"translate(-50%,-50%) scale(.6)", opacity:1 },
       { transform:"translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) rotate(" +
         ((Math.random()-.5)*420) + "deg) scale(1)", opacity:0 }],
      { duration: 800 + Math.random() * 500, easing:"cubic-bezier(.25,.7,.4,1)" }
    ).onfinish = () => d.remove();
  } catch (e) { setTimeout(() => d.remove(), 1100); }
}
function confetti(n){
  for (let i = 0; i < n; i++) petal(window.innerWidth / 2 + (Math.random()-.5)*180, 30);
}

/* ==========================================================================
   事件
   ========================================================================== */
$("scene").addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest(".node") : null;
  if (b) onGather(b);
});
$("lifeBox").addEventListener("click", e => {
  const p = e.target.closest ? e.target.closest(".plot") : null;
  if (p) onFarmTap(+p.dataset.i);
});

for (const b of document.querySelectorAll("#tabs button")) {
  b.onclick = () => { Sound.wake(); showScreen(b.dataset.scr); };
}
$("btnBack").onclick = () => showScreen("Map");
$("btnSleep").onclick = doSleep;
$("btnSet").onclick = () => { renderSettings(); openOvl("ovlSet"); };
$("ovlSet").onclick = e => { if (e.target === $("ovlSet")) closeAll(); };
$("ovlBottle").onclick = e => { if (e.target === $("ovlBottle")) closeAll(); };
$("ovlEnd").onclick = e => { if (e.target === $("ovlEnd")) closeAll(); };

$("btnSound").onclick = () => {
  Sound.wake();
  S.amb = S.amb === "waves" ? "rain" : (S.amb === "rain" ? "off" : "waves");
  Sound.setAmb(S.amb);
  saveNow();
  updateSoundBtn();
  renderSettings();
  toast(S.amb === "waves" ? "🌊 海浪" : S.amb === "rain" ? "🌧 雨声" : "🔇 静音", 1200);
};
function updateSoundBtn(){
  $("btnSound").textContent = S.amb === "waves" ? "🌊" : S.amb === "rain" ? "🌧" : "🔇";
}

function renderSettings(){
  for (const b of document.querySelectorAll("#segAmb button"))
    b.classList.toggle("on", b.dataset.v === S.amb);
  for (const b of document.querySelectorAll("#segSfx button"))
    b.classList.toggle("on", (b.dataset.v === "1") === !!S.sfx);
  for (const b of document.querySelectorAll("#segTts button"))
    b.classList.toggle("on", (b.dataset.v === "1") === !!S.tts);
}
for (const b of document.querySelectorAll("#segAmb button")) {
  b.onclick = () => { Sound.wake(); S.amb = b.dataset.v; Sound.setAmb(S.amb); saveNow();
    updateSoundBtn(); renderSettings(); };
}
for (const b of document.querySelectorAll("#segSfx button")) {
  b.onclick = () => { S.sfx = b.dataset.v === "1"; saveNow(); renderSettings(); if (S.sfx) Sfx.gather(); };
}
for (const b of document.querySelectorAll("#segTts button")) {
  b.onclick = () => { S.tts = b.dataset.v === "1"; saveNow(); renderSettings(); if (S.tts) TTS.say("hello"); };
}

$("btnReset").onclick = () => {
  if (!confirm("清空所有进度？建的、采的、日记里的都会没。")) return;
  S = JSON.parse(JSON.stringify(DEFAULTS));
  saveNow();
  closeAll();
  for (const k in cool) delete cool[k];
  renderRes(); renderMap(); renderCamp(); renderDiary(); renderSettings(); updateSoundBtn();
  $("dayBadge").textContent = "第 1 天";
  showScreen("Map");
  toast("重新漂流一次 🌊", 1600);
};

// 切出去只把声音压低，不动进度
document.addEventListener("visibilitychange", () => {
  try {
    if (!Sound.ready) return;
    const g = Sound.bus.gain, t = Sound.ctx.currentTime;
    if (document.hidden) g.setTargetAtTime(0.0001, t, .4);
    else if (Sound.mode && Sound.mode !== "off") g.setTargetAtTime(0.5, t, 1.2);
    if (document.hidden && "speechSynthesis" in window) speechSynthesis.cancel();
  } catch (e) {}
});
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

/* ==========================================================================
   启动
   ========================================================================== */
function refreshDay(){ $("dayBadge").textContent = "第 " + S.day + " 天"; }
refreshDay();
updateSoundBtn();
renderRes();
renderMap();
renderCamp();
renderDiary();
renderSettings();

setTimeout(() => toast(CONFIG.name + "，你漂到「" + CONFIG.islandName + "」上了 🌴", 3000), 700);

/* 给无头测试留的钩子 */
window.__GAME__ = {
  B: ZONES, BUILDS: BUILDS, CRAFTS: CRAFTS, RES: RES, WORDS: WORDS,
  S: function(){ return S; },
  onGather: onGather, doBuild: doBuild, doSleep: doSleep, onFarmTap: onFarmTap,
  showScreen: showScreen, enterZone: enterZone, curZone: function(){ return curZone; },
  gatherKey: function(btn){ return btn ? btn.dataset.key : null; },
  affordable: affordable, config: CONFIG, cool: cool
};
</script>
</body>
</html>
